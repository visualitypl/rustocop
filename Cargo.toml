[package]
name = "rustocop"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A blazing-fast, opinionated Ruby linter — zero-config by default, no Ruby runtime required"
keywords = ["ruby", "linter", "rubocop", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
memchr = "2"
rayon = "1"
regex = "1"
# Parser stack sizing, fixed-3.4 option plumbing and local C guards are audited for 1.9.0.
ruby-prism = "=1.9.0"
ruby-prism-sys = "=1.9.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
tempfile = "3"
stacker = "0.1.25"

[dev-dependencies]
serde_json = "1"

[patch.crates-io]
ruby-prism = { path = "vendor/ruby-prism" }
ruby-prism-sys = { path = "vendor/ruby-prism-sys" }
