[package]
name = "rustocop"
version = "1.6.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "A fast Ruby linter and autocorrector written in Rust, compatible with RuboCop"
keywords = ["ruby", "linter", "rubocop", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
autotests = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
memchr = "2"
rayon = "1"
regex = "1"
# Parser stack sizing, fixed-3.4 option plumbing and local C guards are audited for 1.9.0.
ruby-prism = "=1.9.0"
ruby-prism-sys = "=1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The version that `toml` uses: adds a baseline to an existing rustocop.toml.
toml_edit = "0.25"
unicode-width = "0.2"
# Reads `.rubocop.yml` for `--import-rubocop-config`.
yaml-rust2 = { version = "0.13", default-features = false }
stacker = "0.1.25"

[target.'cfg(unix)'.dependencies]
# Safe effective-ID/group queries for Ruby File::Stat permission semantics.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/main.rs"

# The test suite runs about 30 % faster at opt-level 1 than at 0.
[profile.dev]
opt-level = 1

[patch.crates-io]
ruby-prism = { path = "vendor/ruby-prism" }
ruby-prism-sys = { path = "vendor/ruby-prism-sys" }
