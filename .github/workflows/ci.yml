name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so that a new advisory, Rust release or runner image shows up
    # without a commit, and the test image's cache, which GitHub evicts after
    # a week unused, stays warm.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # The release workflow runs CI on a tag before it publishes the release.
  workflow_call:
    inputs:
      ref:
        description: The commit to check.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run for the previous one;
  # every other run, such as each push to master, completes.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - run: tools/check.sh lint

  # The steps of tools/check.sh that need the test image: the pinned Rubies
  # and RuboCop checkout. Each job runs one step, as `tools/docker-test.sh
  # tools/check.sh <step>` does locally.
  test:
    name: ${{ matrix.step }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # The architectures of the Linux release binaries.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        step: [test, test-ruby-4.0]
        include:
          # The Ruby tools and generators are independent of the architecture.
          - runner: ubuntu-24.04
            step: tools
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read the build arguments of the test image
        id: image
        # As tools/docker-test.sh reads them.
        run: |
          rust_version=$(awk -F '"' '/^rust-version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          rubocop_revision=$(sed -n 's/^# RuboCop revision: //p' tools/oracle/baseline.txt)
          if [ -z "$rust_version" ] || [ -z "$rubocop_revision" ]; then
            echo "::error::could not read the Rust version or the RuboCop revision"
            exit 1
          fi
          echo "rust-version=$rust_version" >>"$GITHUB_OUTPUT"
          echo "rubocop-revision=$rubocop_revision" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.test
          build-args: |
            RUST_VERSION=${{ steps.image.outputs.rust-version }}
            RUBOCOP_REVISION=${{ steps.image.outputs.rubocop-revision }}
          tags: rustocop-test
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=test-image-${{ runner.arch }}
          # Only master saves, from one job per architecture.
          cache-to: >-
            ${{ github.ref == 'refs/heads/master' && matrix.step == 'test'
            && format('type=gha,mode=max,scope=test-image-{0}', runner.arch) || '' }}

      - name: tools/check.sh ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
        run: >-
          docker run --rm --volume "$PWD:/work:ro"
          --env CARGO_TERM_COLOR --env NEXTEST_PROFILE=ci
          rustocop-test tools/check.sh "$STEP"

  # The test suite needs the Linux test image; this checks that the code
  # builds for the macOS release binaries and that the binary works.
  macos:
    name: build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo build --locked
      - name: Lint a file with an offense
        run: |
          status=0
          output=$(printf 'binding.pry\n' | target/debug/rustocop --stdin app.rb) || status=$?
          echo "$output"
          if [ "$status" -ne 1 ] || [[ $output != *"(Lint/Debugger)"* ]]; then
            echo "::error::expected exit status 1 and a Lint/Debugger offense, got status $status"
            exit 1
          fi

  # Users who build from source use their own Rust, usually the latest.
  stable:
    name: build (stable Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo build --locked --all-targets

  dependencies:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory should not fail an unrelated pull request;
    # it still fails CI on master and the weekly run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check ${{ matrix.checks }}

  workflows:
    name: workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        # actionlint also runs shellcheck on the scripts of the workflows.
        run: |
          archive=actionlint_${VERSION}_linux_amd64.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$archive"
          echo "$SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck tools/*.sh
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false

  # One status for branch protection to require.
  ci:
    name: CI
    if: always()
    needs: [lint, test, macos, stable, dependencies, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
