name: Set up Rust
description: >-
  Installs a Rust toolchain, by default the version that Cargo.toml requires,
  and libclang, which the vendored Prism parser's bindings are generated with,
  and caches the dependencies' build output.

inputs:
  toolchain:
    description: The toolchain to install. Empty for the rust-version of Cargo.toml.
    default: ""
  components:
    description: Extra components to install, separated by commas.
    default: ""

runs:
  using: composite
  steps:
    - name: Install libclang
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

    - name: Install Rust
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        toolchain=${TOOLCHAIN:-$(awk -F '"' '/^rust-version[[:space:]]*=/ { print $2; exit }' Cargo.toml)}
        rustup toolchain install "$toolchain" --profile minimal ${COMPONENTS:+--component "${COMPONENTS// /}"}
        rustup default "$toolchain"
        rustc --version

    # Only master saves, so that pull requests cannot replace its cache.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}
